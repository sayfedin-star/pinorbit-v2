name: Update Pinterest Competitors

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      workspace_id:
        description: 'Workspace UUID (empty = all workspaces)'
        type: string
        required: false
      target_scope:
        description: 'Scope: All Active or Selected'
        type: string
        required: false
        default: 'All Active'
      competitor_ids:
        description: 'Comma-separated competitor UUIDs'
        type: string
        required: false
      target_username:
        description: 'Username (empty = all in scope)'
        type: string
        required: false
      dry_run:
        description: 'Dry-run mode (true/false)'
        type: boolean
        required: false
        default: false
      force_run:
        description: 'Override pipeline-disabled and frequency checks'
        type: boolean
        required: false
        default: false
      trigger:
        description: 'Trigger origin (cron, manual, run_now, full)'
        type: string
        required: false
        default: ''
      run_trigger:
        description: 'Trigger origin legacy alias'
        type: string
        required: false
        default: ''
      job_id:
        description: 'Competitor ingestion job UUID (optional)'
        type: string
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCHEDULING_SUPABASE_URL: ${{ secrets.SCHEDULING_SUPABASE_URL || secrets.PINORBIT_SUPABASE_URL || '' }}
      SCHEDULING_SUPABASE_SECRET_KEY: ${{ secrets.SCHEDULING_SUPABASE_SECRET_KEY || '' }}
      PINTEREST_COOKIE: ${{ secrets.PINTEREST_COOKIE }}
      WORKSPACE_ID: ${{ github.event.inputs.workspace_id || '' }}
      JOB_ID: ${{ github.event.inputs.job_id || '' }}
      TARGET_SCOPE: ${{ github.event.inputs.target_scope || '' }}
      COMPETITOR_IDS: ${{ github.event.inputs.competitor_ids || '' }}
      TARGET_USERNAME: ${{ github.event.inputs.target_username || '' }}
      DRY_RUN: ${{ (github.event.inputs.dry_run == true || github.event.inputs.dry_run == 'true') && 'true' || '' }}
      FORCE_RUN: ${{ (github.event.inputs.force_run == true || github.event.inputs.force_run == 'true') && 'true' || '' }}
      RUN_TRIGGER: ${{ github.event.inputs.trigger || github.event.inputs.run_trigger || '' }}
      EVENT_NAME: ${{ github.event_name }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      COMPETITOR_SHARD: ${{ matrix.shard }}
      SHARD_COUNT: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Log Egress IP
        run: |
          echo "Checking runner egress IP..."
          curl -s --max-time 10 https://api.ipify.org?format=json || true

      - name: Stagger Job Start (IP & DB distribution)
        run: |
          DELAY=$(( ${{ matrix.shard }} * 3 ))
          echo "Stagger delay for shard ${{ matrix.shard }}: ${DELAY}s"
          sleep $DELAY

      - name: Install dependencies
        run: npm install @supabase/supabase-js --no-save

      - name: Run Pinterest Competitors Sync (Shard ${{ matrix.shard }}/5)
        run: node scripts/update-competitors.mjs
